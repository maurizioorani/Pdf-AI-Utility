spring.application.name=pdfapp-test

# H2 In-memory database configuration for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate properties
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect  # Removing explicit dialect as it's auto-detected
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable SQL initialization to prevent PostgreSQL schema conflicts
spring.sql.init.mode=never

# Disable JMX
spring.jmx.enabled=false

# Disable open-in-view warning
spring.jpa.open-in-view=false

# Enable H2 Console (optional for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring AI / RAG Configuration for tests
spring.ai.ollama.base-url=http://localhost:11434
# Ensure a default model is specified for tests if RAG is enabled
# This should match a model available in your test Ollama instance or be mocked.
app.rag.chat-model-name=test-model
app.rag.enabled=true # Assuming RAG features should be tested
