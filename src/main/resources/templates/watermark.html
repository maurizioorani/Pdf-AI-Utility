<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Watermark Tool</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <div th:replace="~{fragments/navbar :: page-navbar('watermark')}"></div>

    <!-- Hero Section -->
    <section class="hero-section text-center">
        <div class="container">
            <h1 class="display-4 fw-bold mb-4">PDF Watermark Tool</h1>
            <p class="lead mb-4">Add customizable watermarks to your PDF documents with text and positioning options.</p>
        </div>
    </section>

    <section class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-primary">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Watermark Settings</h3>
                    </div>
                    <div class="card-body p-4">
                        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
                        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

                        <form method="post" enctype="multipart/form-data" th:action="@{/watermark}">
                            <div class="mb-3">
                                <label for="pdfFile" class="form-label">Select PDF File</label>
                                <input type="file" class="form-control" id="pdfFile" name="pdfFile" accept=".pdf" required>
                                <div class="form-text">Max file size: 200MB</div>
                            </div>

                            <div class="mb-3">
                                <label for="watermarkText" class="form-label">Watermark Text</label>
                                <input type="text" class="form-control" id="watermarkText" name="watermarkText" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="opacity" class="form-label">Opacity (0-1)</label>
                                    <input type="number" class="form-control" id="opacity" name="opacity" 
                                           min="0" max="1" step="0.1" value="0.5">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="position" class="form-label">Position</label>
                                    <select class="form-select" id="position" name="position">
                                        <option value="center" selected>Center</option>
                                        <option value="top-left">Top Left</option>
                                        <option value="top-right">Top Right</option>
                                        <option value="bottom-left">Bottom Left</option>
                                        <option value="bottom-right">Bottom Right</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Add Watermark</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
