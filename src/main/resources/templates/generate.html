<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Generate PDF from HTML</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CKEditor 5 for HTML editing -->    <script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.js"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <style>
        .improve-model-select {
            width: auto;
            min-width: 150px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div th:replace="~{fragments/navbar :: page-navbar (activePage='templates')}"></div>

    <!-- Hero Section -->
    <section class="hero-section text-center">
        <div class="container">
            <h1 class="display-3 fw-bold mb-4">Generate PDF from HTML</h1>
            <p class="lead mb-4">Use the editor below to create or modify HTML content and then generate a PDF.</p>
        </div>
    </section>

    <div class="container my-5">
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <ul class="nav nav-tabs card-header-tabs" id="editorTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="editor-tab" data-bs-toggle="tab" data-bs-target="#editor" type="button" role="tab" aria-controls="editor" aria-selected="true">HTML Editor</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="live-preview-tab" data-bs-toggle="tab" data-bs-target="#live-preview" type="button" role="tab" aria-controls="live-preview" aria-selected="false">Live Preview</button>
                            </li>
                        </ul>
                    </div>
                    <div class="card-body">
                        <div class="tab-content" id="editorTabsContent">
                            <div class="tab-pane fade show active" id="editor" role="tabpanel" aria-labelledby="editor-tab">                                <form id="htmlForm" method="post">
                                    <div class="mb-3">
                                        <label for="templateName" class="form-label">Template Name:</label>
                                        <input type="text" class="form-control" id="templateName" name="name" placeholder="Enter a name for your template" th:value="${htmlTemplate.name}">
                                    </div>                                    <input type="hidden" id="templateId" name="id" th:value="${htmlTemplate.id}">
                                    <label for="htmlEditor" class="form-label visually-hidden">HTML Content:</label> <!-- Visually hidden label for accessibility -->
                                    <textarea id="htmlEditor" name="htmlContent" th:text="${htmlTemplate.htmlContent}" aria-label="HTML Content Editor"></textarea>
                                </form>
                            </div>
                            <div class="tab-pane fade" id="live-preview" role="tabpanel" aria-labelledby="live-preview-tab">
                                <iframe id="previewFrame" class="preview-frame" title="HTML Content Preview"></iframe>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
          <div class="row">
            <div class="col-12">                <div class="d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center flex-wrap gap-2">
                        <button id="saveBtn" class="btn btn-info me-2" onclick="saveHtmlTemplate()">Save Template</button>
                        <div class="d-flex align-items-center gap-2">
                            <button id="improveBtn" class="btn btn-warning" onclick="improveContentWithAI()">
                                <i class="fas fa-robot me-1"></i>Improve with AI
                            </button>
                            <select id="improveModelSelection" name="improveModelName" class="form-select improve-model-select" 
                                    title="Select AI model for content improvement" aria-label="Select AI model for content improvement">
                                <option value="">Select AI Model</option>
                                <option th:each="model : ${availableModels}" th:value="${model}" th:text="${model}" 
                                        th:selected="${model == 'llama3'}">Model</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <button id="previewBtn" class="btn btn-primary me-2" onclick="previewPdf()">Preview PDF</button>
                        <button id="generateBtn" class="btn btn-success" onclick="generatePdf()">Download PDF</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Saved Templates Section -->
    <section class="bg-light py-5">
        <div class="container">
            <h2 class="mb-4">Saved Templates</h2>
            <div th:if="${htmlTemplates != null and not #lists.isEmpty(htmlTemplates)}">
                <ul class="list-group">
                    <li class="list-group-item d-flex justify-content-between align-items-center" th:each="template : ${htmlTemplates}">
                        <a th:href="@{'/templates?templateId=' + ${template.id}}" th:text="${template.name}">Template Name</a>
                        <div>
                            <a th:href="@{'/templates/preview-raw?templateId=' + ${template.id}}" class="btn btn-sm btn-outline-secondary me-2" target="_blank">Preview Raw</a>
                            <a th:href="@{'/templates/delete/' + ${template.id}}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this template?');">Delete</a>
                        </div>
                    </li>
                </ul>
            </div>
            <div th:if="${htmlTemplates == null or #lists.isEmpty(htmlTemplates)}">
                <p>No saved templates found.</p>
            </div>
        </div>
    </section>
    
    <!-- Footer -->
    <div th:replace="~{fragments/footer :: page-footer}"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>    <script>
        let ckeditorInstance;        ClassicEditor
            .create(document.querySelector('#htmlEditor'), {
                toolbar: {
                    items: [
                        'undo', 'redo',
                        '|', 'heading',
                        '|', 'bold', 'italic', 'underline', 'strikethrough', 'subscript', 'superscript',
                        '|', 'fontSize', 'fontFamily', 'fontColor', 'fontBackgroundColor',
                        '|', 'link', 'insertImage', 'insertTable', 'blockQuote', 'mediaEmbed',
                        '|', 'bulletedList', 'numberedList', 'outdent', 'indent',
                        '|', 'alignment:left', 'alignment:center', 'alignment:right', 'alignment:justify',
                        '|', 'horizontalLine', 'pageBreak',
                        '|', 'code', 'codeBlock',
                        '|', 'removeFormat', 'sourceEditing'
                    ],
                    shouldNotGroupWhenFull: true
                },
                heading: {
                    options: [
                        { model: 'paragraph', title: 'Paragraph', class: 'ck-heading_paragraph' },
                        { model: 'heading1', view: 'h1', title: 'Heading 1', class: 'ck-heading_heading1' },
                        { model: 'heading2', view: 'h2', title: 'Heading 2', class: 'ck-heading_heading2' },
                        { model: 'heading3', view: 'h3', title: 'Heading 3', class: 'ck-heading_heading3' },
                        { model: 'heading4', view: 'h4', title: 'Heading 4', class: 'ck-heading_heading4' },
                        { model: 'heading5', view: 'h5', title: 'Heading 5', class: 'ck-heading_heading5' },
                        { model: 'heading6', view: 'h6', title: 'Heading 6', class: 'ck-heading_heading6' }
                    ]
                },
                fontSize: {
                    options: [
                        9, 10, 11, 12, 'default', 14, 16, 18, 20, 22, 24, 26, 28, 36, 48, 72
                    ]
                },
                fontFamily: {
                    options: [
                        'default',
                        'Arial, Helvetica, sans-serif',
                        'Courier New, Courier, monospace',
                        'Georgia, serif',
                        'Lucida Sans Unicode, Lucida Grande, sans-serif',
                        'Tahoma, Geneva, sans-serif',
                        'Times New Roman, Times, serif',
                        'Trebuchet MS, Helvetica, sans-serif',
                        'Verdana, Geneva, sans-serif'
                    ]
                },
                table: {
                    contentToolbar: [
                        'tableColumn', 'tableRow', 'mergeTableCells',
                        'tableProperties', 'tableCellProperties'
                    ]
                },
                image: {
                    toolbar: [
                        'imageStyle:inline',
                        'imageStyle:block',
                        'imageStyle:side',
                        '|',
                        'toggleImageCaption',
                        'imageTextAlternative'
                    ]
                },
                link: {
                    decorators: {
                        openInNewTab: {
                            mode: 'manual',
                            label: 'Open in a new tab',
                            attributes: {
                                target: '_blank',
                                rel: 'noopener noreferrer'
                            }
                        }
                    }
                }
            })
            .then(editor => {
                ckeditorInstance = editor;
                console.log('CKEditor 5 was initialized', editor);

                // Live preview update on change
                editor.model.document.on('change:data', () => {
                    if (document.getElementById('live-preview').classList.contains('active')) {
                        updatePreview();
                    }
                    // Keep the textarea updated for form submission
                    const htmlEditorTextarea = document.getElementById('htmlEditor');
                    if (htmlEditorTextarea) {
                        htmlEditorTextarea.value = editor.getData();
                    }
                });
            })
            .catch(error => {
                console.error('There was a problem initializing CKEditor 5:', error);
            });

        // Aggiorna anteprima quando si cambia tab
        document.getElementById('live-preview-tab').addEventListener('shown.bs.tab', function () {
            updatePreview();
        });
        
        // Aggiorna anteprima HTML
        function updatePreview() {
            if (!ckeditorInstance) return;
            var previewFrame = document.getElementById('previewFrame');
            var previewDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            previewDoc.open();
            previewDoc.write(ckeditorInstance.getData());
            previewDoc.close();
        }
        
        function updateTextareaBeforeSubmit() {
            if (ckeditorInstance) {
                const htmlEditorTextarea = document.getElementById('htmlEditor');
                if (htmlEditorTextarea) {
                    htmlEditorTextarea.value = ckeditorInstance.getData();
                }
            }
        }

        // Anteprima PDF
        function previewPdf() {
            updateTextareaBeforeSubmit();
            var form = document.getElementById('htmlForm');
            // This function is intended to preview the current editor content.
            // The closest equivalent is PdfSimpleGenController's /simple-generate/create
            // which takes htmlContent and returns a PDF.
            // Note: This will act like a download, not an inline preview in a new tab as /generate/preview might have.
            // For a true page preview of current content, a new endpoint would be needed.
            // For previewing a *saved* template on a page: /templates/preview-page?templateId=... (GET)
            // For raw HTML of a *saved* template: /templates/preview-raw?templateId=... (GET)
            form.action = "/simple-generate/create"; // Changed to use direct HTML to PDF generation
            form.target = "_blank"; // This will open/download the PDF
            form.submit();
        }
        
        // Genera PDF
        function generatePdf() {
            updateTextareaBeforeSubmit();
            var form = document.getElementById('htmlForm');
            // This function is for downloading the current editor content as PDF.
            // PdfSimpleGenController's /simple-generate/create is suitable.
            form.action = "/simple-generate/create"; // Changed to use direct HTML to PDF generation
            form.target = "_blank"; // This will open/download the PDF
            form.submit();
        }
          // Salva Template HTML
        function saveHtmlTemplate() {
            updateTextareaBeforeSubmit();
            var form = document.getElementById('htmlForm');
            form.action = "/templates/save"; // Changed to new save endpoint
            form.target = "_self";
            form.submit();
        }

        // Improve Content with AI
        function improveContentWithAI() {
            if (!ckeditorInstance) {
                alert('Editor not initialized');
                return;
            }            const content = ckeditorInstance.getData();
            if (!content || content.trim() === '') {
                alert('Please add some content before improving with AI.');
                return;
            }

            // Get selected model
            const modelSelect = document.getElementById('improveModelSelection');
            const selectedModel = modelSelect.value;
            
            if (!selectedModel) {
                alert('Please select an AI model first.');
                return;
            }

            const improveBtn = document.getElementById('improveBtn');
            const originalText = improveBtn.innerHTML;
            
            // Show loading state
            improveBtn.disabled = true;
            improveBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Improving...';

            // Create form data
            const formData = new FormData();
            formData.append('content', content);
            formData.append('model', selectedModel);

            // Send request to backend
            fetch('/improve-content', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(text || 'Server error');
                    });
                }
                return response.text();
            })
            .then(improvedContent => {
                // Update editor content with improved version
                ckeditorInstance.setData(improvedContent);
                
                // Show success message
                showNotification('Content improved successfully!', 'success');
            })
            .catch(error => {
                console.error('Error improving content:', error);
                
                // Check if it's a connection error to Ollama
                if (error.message.includes('connect') || error.message.includes('Ollama')) {
                    showOllamaErrorModal();
                } else {
                    showNotification('Error improving content: ' + error.message, 'error');
                }
            })
            .finally(() => {
                // Reset button state
                improveBtn.disabled = false;
                improveBtn.innerHTML = originalText;
            });
        }

        // Show notification function
        function showNotification(message, type) {
            const alertClass = type === 'success' ? 'alert-success' : 'alert-danger';
            const alertHtml = `
                <div class="alert ${alertClass} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
            
            // Insert notification at the top of the container
            const container = document.querySelector('.container.my-5');
            container.insertAdjacentHTML('afterbegin', alertHtml);
            
            // Auto-dismiss after 5 seconds
            setTimeout(() => {
                const alert = container.querySelector('.alert');
                if (alert) {
                    const bsAlert = new bootstrap.Alert(alert);
                    bsAlert.close();
                }
            }, 5000);
        }

        // Show Ollama error modal
        function showOllamaErrorModal() {
            const modalHtml = `
                <div class="modal fade" id="ollamaErrorModal" tabindex="-1" aria-labelledby="ollamaErrorModalLabel" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="ollamaErrorModalLabel">Ollama Connection Issue</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <p>Could not connect to the Ollama server to improve the content.</p>
                                <p>Please ensure that your Ollama server is running and accessible at the configured address (usually <code>http://localhost:11434</code>).</p>
                                <p>The content improvement feature requires an active Ollama connection.</p>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // Remove existing modal if present
            const existingModal = document.getElementById('ollamaErrorModal');
            if (existingModal) {
                existingModal.remove();
            }
            
            // Add modal to body
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            // Show modal
            const modal = new bootstrap.Modal(document.getElementById('ollamaErrorModal'));
            modal.show();
        }
    </script>
</body>
</html>
